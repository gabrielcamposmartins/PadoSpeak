[package]
name = "padospeak-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PadoSpeak desktop: cliente + servidor embutido (botão Hostear)."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
padospeak-server = { path = "../../server" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# Atalhos de silenciar/ensurdecer que funcionam com o app em segundo plano
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
# Notificações nativas do Windows com clique (abre a conversa da notificação)
tauri-winrt-notification = "0.8"
# Iniciar com o Windows (chave Run do usuário)
winreg = "0.55"
# Jogo em foco (janela/processo) e janela escolhida na transmissão
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse"] }
# Som da transmissão: só da janela, ou do sistema sem o PadoSpeak (process loopback)
wasapi = "0.26"
