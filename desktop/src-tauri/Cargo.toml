[package]
name = "padospeak-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PadoSpeak desktop: cliente + servidor embutido (botão Hostear)."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
padospeak-server = { path = "../../server" }
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Notificações nativas do Windows com clique (abre a conversa da notificação)
tauri-winrt-notification = "0.8"
# Iniciar com o Windows (chave Run do usuário)
winreg = "0.55"
