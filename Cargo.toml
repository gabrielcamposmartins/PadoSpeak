[workspace]
resolver = "2"
members = ["server", "desktop/src-tauri"]

[workspace.package]
version = "1.5.0"
edition = "2021"
license = "MIT"

# Dependências otimizadas mesmo em debug (bcrypt e libSQL ficam lentos sem isso).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
