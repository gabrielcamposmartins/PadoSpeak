# padospeak.padoru.org no nginx de borda da VM (/srv/edge/nginx/conf.d/padospeak.conf).
#
# Tudo vai para o padospeak-server (rede "edge"): o cliente web, a API (/api), o WebSocket (/ws)
# e o stream da música. O TLS termina aqui (Let's Encrypt); por dentro é HTTP.
# O `map $http_upgrade $connection_upgrade` fica no 00-default.conf, comum a todos os sites.

server {
    listen 80;
    server_name padospeak.padoru.org;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # A porta 443 é do roteador TLS (edge/stream.d/443.conf), que repassa com o IP real (PROXY protocol).
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name padospeak.padoru.org;

    ssl_certificate     /etc/letsencrypt/live/padospeak.padoru.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/padospeak.padoru.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # DNS interno do Docker a cada requisição: o nginx não quebra se o contêiner for recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $padospeak http://padospeak-server:3000;

    # fotos, stickers e o resto da API, com folga (os arquivos das conversas têm o bloco próprio abaixo)
    client_max_body_size 30m;

    location / {
        proxy_pass $padospeak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # conversas paradas e chamadas longas não podem cair pelo timeout padrão de 60 s
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # envio de arquivos: os grandes (tamanho e validade escolhidos no painel do administrador, até
    # 10 GB) vão direto para o servidor aos poucos, sem o nginx guardar uma cópia temporária no disco
    location = /api/files {
        proxy_pass $padospeak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10300m;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # download de arquivos: sai direto (sem cópia temporária no disco da VM)
    location /api/files/ {
        proxy_pass $padospeak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # música: o áudio sai aos poucos para todos no canal; sem buffer no nginx
    location /api/music/stream/ {
        proxy_pass $padospeak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
