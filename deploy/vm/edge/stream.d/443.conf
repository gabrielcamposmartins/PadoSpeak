# Porta 443 do nginx de borda (/srv/edge/nginx/stream.d/443.conf): olha o início do TLS sem decifrar.
# - padospeak.padoru.org sem ALPN HTTP (é o TURN das chamadas: navegadores e o app não mandam ALPN, ou
#   mandam "stun.turn") → TLS termina aqui e segue para o coturn;
# - todo o resto (sites, com ALPN h2/http/1.1) → os servidores HTTPS em 127.0.0.1:8443 (conf.d), com o
#   IP real de quem conectou pelo PROXY protocol.
map "$ssl_preread_server_name|$ssl_preread_alpn_protocols" $tls_backend {
    "padospeak.padoru.org|"          127.0.0.1:5349;
    "padospeak.padoru.org|stun.turn" 127.0.0.1:5349;
    default                          127.0.0.1:8443;
}

server {
    listen 443;
    ssl_preread on;
    proxy_pass $tls_backend;
    proxy_protocol on;
    proxy_connect_timeout 5s;
    # WebSockets e chamadas ficam abertos por horas
    proxy_timeout 1h;
}

# TURN por TLS: o certificado do padospeak.padoru.org; por dentro, TCP simples até o coturn.
server {
    listen 127.0.0.1:5349 ssl proxy_protocol;
    ssl_certificate     /etc/letsencrypt/live/padospeak.padoru.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/padospeak.padoru.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    proxy_pass 172.19.0.250:3478;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
}
