# Publica uma versão do app desktop (mesmo esquema do Pokeru).
#
# Só a main publica, e só por tag: ao criar `vX.Y.Z` na main, esta action testa, compila o app, cria a
# release e sobe o instalador — mais o `.sig` e o `latest.json` quando há chave de assinatura, que é o
# que o atualizador automático do PadoSpeak consulta.
#
# A assinatura do atualizador é **opcional** aqui, e a action não barra por causa dela. Com os segredos
# configurados (Settings → Secrets and variables → Actions), a partir da chave gerada por
# `tauri signer generate`:
#
#   TAURI_SIGNING_PRIVATE_KEY           conteúdo de ~/.tauri/padospeak-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  a senha da chave (vazio se ela não tiver)
#
# …a release sai com `.sig` e `latest.json`, e o app se atualiza sozinho.
#
# **Sem eles** a action compila de todo jeito, mas **não publica**: o instalador fica como artefato do
# job (aba Summary → Artifacts). Ela não publica porque um pacote sem assinatura substituiria, numa
# release já feita à mão, o instalador assinado — e aí o `.sig` deixaria de bater com o arquivo e o
# atualizador recusaria a versão.

name: Release

on:
  push:
    tags: ['v*.*.*']
  # permite repetir uma publicação pela interface do GitHub (escolha a tag em "Run workflow")
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Instalador (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tem chave de assinatura?
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo 'signed=true' >> "$GITHUB_OUTPUT"
            echo '✓ assinatura ligada: a release sai com o instalador, o .sig e o latest.json.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Sem TAURI_SIGNING_PRIVATE_KEY: o instalador fica como artefato do job e nada é publicado."
            echo '⚠ **Sem `TAURI_SIGNING_PRIVATE_KEY`.** Compilei, mas **não publiquei**: o instalador está em *Artifacts*.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: A tag está na main?
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Esta tag não aponta para um commit da main — publique a partir da main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: As versões batem com a tag?
        shell: bash
        run: node scripts/version.mjs --check "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      # nada de publicar uma versão quebrada
      - run: npm run build:client
      - run: cargo test -p padospeak-server

      - name: Compila, assina e publica
        if: steps.sign.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --bundles nsis
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: PadoSpeak __VERSION__
          releaseBody: |
            Instalador do app desktop (Windows x64). O app **se atualiza sozinho**: quem já está na 1.1.0 ou
            mais recente recebe esta versão ao abrir o PadoSpeak.

            Instalação manual: baixe e execute `PadoSpeak-setup.exe` (instala para o usuário atual, sem
            administrador). O instalador não é assinado com certificado de código, então o SmartScreen avisa
            — *Mais informações* → *Executar assim mesmo*.

            Os arquivos `latest.json` e `.sig` são o que o atualizador consulta.
          releaseDraft: false
          prerelease: false
          # gera e sobe o latest.json (o manifesto lido pelo atualizador)
          includeUpdaterJson: true

      # Link fixo para o botão de download: toda release leva também o PadoSpeak-setup.exe.
      - name: Sobe o PadoSpeak-setup.exe (nome fixo)
        if: steps.sign.outputs.signed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          [ -n "$tag" ] || tag="v$(node -p "require('./package.json').version")"
          exe=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$exe" PadoSpeak-setup.exe
          gh release upload "$tag" PadoSpeak-setup.exe --clobber

      # Sem chave: compila e entrega o binário, sem tocar em release nenhuma. O `createUpdaterArtifacts`
      # é desligado aqui, senão o Tauri para por falta da chave privada no meio da compilação.
      - name: Compila sem assinar
        if: steps.sign.outputs.signed != 'true'
        shell: bash
        run: cd desktop && npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Guarda o instalador como artefato
        if: steps.sign.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: padospeak-instalador-sem-assinatura
          if-no-files-found: error
          path: target/release/bundle/nsis/*.exe
