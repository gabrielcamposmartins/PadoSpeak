[package]
name = "padospeak-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Servidor do PadoSpeak: API REST, WebSocket, sinalização WebRTC e banco Turso/libSQL."

[lib]
name = "padospeak_server"
path = "src/lib.rs"

[[bin]]
name = "padospeak-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
# O assistente chama a própria API por dentro (`tower::ServiceExt::oneshot`), com o login de quem pediu
tower = { version = "0.5", features = ["util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libsql = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.19"
uuid = { version = "1", features = ["v4"] }
rust-embed = "8"
mime_guess = "2"
local-ip-address = "0.6"
# Rede local: anúncio por broadcast UDP com reuso de porta
socket2 = "0.6"
base64 = "0.22"
# Criptografia das mensagens guardadas (AES-256-GCM); o mesmo ring do rustls
ring = "0.17"
# Notificações push (Web Push com VAPID), em Rust puro
web-push-native = "0.5"
# Música: proxy do áudio e download das ferramentas (yt-dlp/Deno)
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "json"] }
flate2 = "1"
# E-mail (confirmar o e-mail da conta e o código de "esqueci a senha"), com o mesmo rustls/ring
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-no-provider", "webpki-roots"] }
tar = "0.4"
fs4 = "0.13"
# Nó de mídia: SFU das chamadas (o mesmo do HardLine), em Rust puro (DTLS/SRTP sem OpenSSL)
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
# O nó liga para o servidor principal (canal de controle e música) por WebSocket, com o mesmo rustls
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# Raízes de confiança do conector TLS do nó de mídia (com ALPN http/1.1, veja media/control.rs).
webpki-roots = "0.26"
